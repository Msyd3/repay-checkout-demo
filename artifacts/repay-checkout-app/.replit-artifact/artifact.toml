kind = "web"
previewPath = "/repay-checkout/"
title = "Repay Checkout"
description = "A publishable Arabic Repay checkout demo with mobile payment authorization, bank selection, Apple Pay state, and confirmation screens."
version = "1.0.0"
id = "artifacts/repay-checkout-app"
router = "path"

[[services]]
name = "web"
paths = [ "/repay-checkout/" ]
localPort = 19340

[services.development]
run = "pnpm --filter @workspace/repay-checkout-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/repay-checkout-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/repay-checkout-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19340"
BASE_PATH = "/repay-checkout/"
